name: LRS Daily Signal
on:
  schedule:
    - cron: "30 21 * * 1-5"  # 05:30 Asia/Taipei, 美股收盤後
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests
      - name: Diagnose data freshness (Yahoo latest bars)
        run: |
          date -u
          for s in QQQ TQQQ %5EVIX; do
            curl -s -m 30 -A "Mozilla/5.0 (compatible; LRS-Bot/1.0)" "https://query1.finance.yahoo.com/v8/finance/chart/$s?range=5d&interval=1d" \
              | python3 -c "import sys,json,time; r=json.load(sys.stdin)['chart']['result'][0]; print(r['meta']['symbol'], [time.strftime('%m-%d',time.gmtime(t)) for t in r['timestamp']], 'mkt', time.strftime('%m-%d %H:%M',time.gmtime(r['meta']['regularMarketTime'])))" || echo "$s fetch failed"
          done
      - run: python3 main.py
        env:
          MGTASSET_API_TOKEN: ${{ secrets.MGTASSET_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: lrs-report
          path: state/report.html
      # 重建 public/index.html（Cloudflare Worker 的靜態資產），
      # 用當日最新資料覆蓋，並 commit + push，讓網頁頂端日期與股價每日自動更新。
      - run: python3 main.py --output public/index.html
        env:
          MGTASSET_API_TOKEN: ${{ secrets.MGTASSET_API_TOKEN }}
      - name: Commit updated public/index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/index.html; then
            git add public/index.html
            git commit -m "chore(report): daily auto-update public/index.html"
            git push
          else
            echo "No changes to public/index.html"
          fi
